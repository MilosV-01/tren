# Local dev stack for Tren — Postgres + MinIO (S3-compatible storage).
# `docker compose up -d` is all you need; no real cloud account required.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tren
      POSTGRES_PASSWORD: tren
      POSTGRES_DB: tren
    ports:
      - '5432:5432'
    volumes:
      - tren-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tren -d tren']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: tren-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Allow browser PUT/GET straight to presigned URLs from the web app.
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - tren-minio:/data

  # One-shot: wait for MinIO, then create the bucket the app expects.
  minio-init:
    image: minio/mc:RELEASE.2024-07-11T18-01-28Z
    container_name: tren-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/tren-media &&
      echo 'MinIO bucket tren-media ready';
      "

volumes:
  tren-pg:
  tren-minio:
